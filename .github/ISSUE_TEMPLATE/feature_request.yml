name: Feature request
description: Suggest an improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like NEXUS to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Ground rules
      options:
        - label: It would not need NEXUS to invent a number Claude Code does not report.
        - label: I understand a display setting must never change what an agent may do.
